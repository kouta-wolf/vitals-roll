name: Dependabot auto-merge

# Dependabotのパッチ更新は、CIが通ったら自動でマージする(#196)。
# 実際のマージは main のブランチ保護で必須にしたCIの完了を GitHub が待ってから行う。
# ブランチ保護が無いと --auto は即座にマージされるため、必ず併せて設定すること。
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # minor / major は破壊的変更を含みうるため手動で確認する。
      # メンテナが変わった更新は乗っ取りの可能性があるため、パッチでも自動マージしない
      - name: Enable auto-merge for patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.maintainer-changes != 'true'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
