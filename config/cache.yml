default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# database: cache は指定しない。solid_cache の railtie は cache_store の設定に関係なく
# この値を解決しようとするため、database.yml に cache 接続が無いと起動時に
# AdapterNotSpecified で落ちる。本番では :memory_store を使うため参照先も不要（#170）。
production:
  <<: *default
