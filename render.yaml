services:
  - type: web
    name: vitals-roll
    runtime: ruby
    plan: free
    buildCommand: "bundle install && yarn install && bundle exec rails db:prepare assets:precompile"
    startCommand: "bundle exec rails server -b 0.0.0.0 -p $PORT"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_HOST
        sync: false
      - key: MAILER_SENDER
        sync: false
